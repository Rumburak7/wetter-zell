<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pogoda Zell</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="theme-color" content="#0e1a24">
<meta name="apple-mobile-web-app-title" content="Pogoda">
<style>
  :root { --bg:#0e1a24; --card:#16283a; --card2:#1c3349; --ink:#eef6fb; --dim:#8fb0c4; --acc:#f2c26b; --blue:#5cc8ff; --red:#ff8a6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, "Segoe UI", Arial, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  #dla { text-align:center; color:var(--acc); font-size:clamp(20px,3.6vw,34px); font-weight:600; margin:6px 0 10px; }
  .top { display:grid; grid-template-columns: 1fr 1fr; gap:16px; align-items:stretch; }
  .card { background:var(--card); border-radius:18px; padding:16px; }
  #czas { font:700 clamp(54px,10vw,110px)/1 ui-monospace, Consolas, monospace; text-align:center; }
  #czas small { font-size:.38em; color:var(--dim); }
  #data { text-align:center; color:var(--dim); font-size:clamp(18px,2.6vw,26px); margin-top:6px; }
  #miasto { text-align:center; margin-top:10px; font-size:18px; color:var(--dim); }
  .teraz { display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #nakl { width:min(100%,520px); border-radius:14px; display:block; }
  .temp { text-align:center; }
  #t { font-size:clamp(64px,11vw,110px); font-weight:800; line-height:1; }
  #opis { font-size:clamp(20px,2.8vw,28px); margin-top:4px; }
  #odcz { color:var(--dim); font-size:18px; margin-top:4px; }
  #minmax { font-size:20px; margin-top:6px; }
  .kafle { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
  .k { background:var(--card2); border-radius:14px; padding:12px; text-align:center; }
  .k .i { font-size:26px; }
  .k .v { font-size:24px; font-weight:700; margin-top:2px; }
  .k .n { color:var(--dim); font-size:14px; }
  h2 { font-size:20px; margin:22px 0 10px; color:var(--dim); font-weight:600; }
  .godz { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .g { flex:0 0 74px; background:var(--card); border-radius:12px; padding:10px 4px; text-align:center; }
  .g .h { color:var(--dim); font-size:14px; } .g .e { font-size:26px; margin:4px 0; } .g .tt { font-weight:700; font-size:18px; } .g .pp { color:var(--blue); font-size:13px; }
  .dni { display:grid; gap:8px; }
  .d { display:grid; grid-template-columns: 130px 44px 1fr 90px 160px; align-items:center; gap:10px; background:var(--card); border-radius:12px; padding:10px 14px; font-size:19px; }
  .d .dn::first-letter { text-transform:uppercase; } .d .e { font-size:30px; text-align:center; } .d .ds { color:var(--dim); font-size:16px; }
  .d .mm b { color:var(--red); } .d .mm span { color:var(--blue); } .d .pp { color:var(--blue); font-size:16px; text-align:right; }
  footer { text-align:center; color:#56778a; font-size:13px; margin:22px 0 8px; }
  #blad { display:none; background:#5a2a2a; color:#fff; padding:10px; border-radius:10px; text-align:center; margin-top:10px; }
  @media (max-width:760px) { .top { grid-template-columns:1fr; } .kafle { grid-template-columns:repeat(2,1fr); } .d { grid-template-columns: 112px 34px 1fr 78px; font-size:17px; padding:10px; } .d .pp { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="dla">Pogoda w Zell am Harmersbach</div>
  <div class="top">
    <div class="card">
      <div id="czas">--:--</div>
      <div id="data"></div>
      <div id="miasto">📍 Zell am Harmersbach</div>
      <div class="temp" style="margin-top:14px">
        <div id="t">--°</div>
        <div id="opis">Ładuję pogodę…</div>
        <div id="odcz"></div>
        <div id="minmax"></div>
      </div>
    </div>
    <div class="card teraz"><img id="nakl" src="s/slonce.webp" alt="pogoda"></div>
  </div>
  <div id="blad">Nie mogę pobrać pogody - sprawdź internet. Spróbuję znowu za chwilę.</div>
  <div class="kafle" id="kafle"></div>
  <h2>Następne godziny</h2>
  <div class="godz" id="godz"></div>
  <h2>Następne dni</h2>
  <div class="dni" id="dni"></div>
  <footer>Dane pogodowe: Open-Meteo.com · odświeża się samo co 10 minut · <span id="akt"></span></footer>
</div>
<script>
// Zell am Harmersbach (tylko miasto - bez adresu)
const LAT = 48.3486, LON = 8.0636, STREFA = 'Europe/Berlin';

// kody pogody (WMO) -> opis + emoji
const KOD = {
  0: ['Bezchmurnie', '☀️', '🌙'], 1: ['Prawie bezchmurnie', '🌤️', '🌙'], 2: ['Częściowe zachmurzenie', '⛅', '☁️'], 3: ['Pochmurno', '☁️', '☁️'],
  45: ['Mgła', '🌫️'], 48: ['Mgła szronowa', '🌫️'],
  51: ['Lekka mżawka', '🌦️'], 53: ['Mżawka', '🌦️'], 55: ['Gęsta mżawka', '🌧️'], 56: ['Marznąca mżawka', '🌧️'], 57: ['Marznąca mżawka', '🌧️'],
  61: ['Lekki deszcz', '🌦️'], 63: ['Deszcz', '🌧️'], 65: ['Ulewa', '🌧️'], 66: ['Marznący deszcz', '🌧️'], 67: ['Marznący deszcz', '🌧️'],
  71: ['Lekki śnieg', '🌨️'], 73: ['Śnieg', '🌨️'], 75: ['Duży śnieg', '❄️'], 77: ['Ziarnisty śnieg', '🌨️'],
  80: ['Przelotny deszcz', '🌦️'], 81: ['Przelotne opady', '🌧️'], 82: ['Gwałtowna ulewa', '⛈️'], 85: ['Przelotny śnieg', '🌨️'], 86: ['Śnieżyca', '❄️'],
  95: ['Burza', '⛈️'], 96: ['Burza z gradem', '⛈️'], 99: ['Silna burza z gradem', '⛈️']
};
const opis = (c) => (KOD[c] || ['', '🌡️'])[0];
const emo = (c, dzien) => { const k = KOD[c] || ['', '🌡️']; return !dzien && k[2] ? k[2] : k[1]; };
const KIER = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'], KIERPL = { N: 'północny', NE: 'pn.-wsch.', E: 'wschodni', SE: 'pd.-wsch.', S: 'południowy', SW: 'pd.-zach.', W: 'zachodni', NW: 'pn.-zach.' };
const kier = (d) => KIER[Math.round(d / 45) % 8];
const dwa = n => String(n).padStart(2, '0');
const godz = s => s.slice(11, 16);
const pl1 = v => (v || 0).toFixed(1).replace('.', ',');
const duza = s => s.charAt(0).toUpperCase() + s.slice(1);

// ktora naklejka (Adam) pasuje do pogody
function naklejka(c, t, wiatr, porywy, dzien, opadBylo, miesiac) {
  if (c >= 95) return c === 95 ? 'burza' : 'grzmi';
  if ([71, 73, 75, 77, 85, 86].includes(c)) return 'snieg';
  if (c >= 51 && c <= 82) return 'pada';
  if (c === 45 || c === 48) return 'mgla';
  if (porywy >= 55 || wiatr >= 35) return 'wieje';
  if (t >= 30) return 'goraco';
  if (t <= -3) return 'zimno';
  if (dzien && c <= 2 && opadBylo) return 'tecza';
  if (t <= 3) return [11, 0, 1, 2].includes(miesiac) ? 'zima' : 'zimno';
  if (c === 3) return 'pochmurno';
  if (c === 2) return t >= 18 ? 'cieplo' : 'pochmurno';
  // ladnie (0 / 1)
  if (t >= 25) return [5, 6, 7].includes(miesiac) ? 'lato' : 'cieplo';
  if ([2, 3, 4].includes(miesiac) && t >= 8) return 'wiosna';
  if (t >= 17) return 'piekna';
  return 'slonce';
}

function zegar() {
  const d = new Date();
  document.getElementById('czas').innerHTML = dwa(d.getHours()) + ':' + dwa(d.getMinutes()) + '<small> ' + dwa(d.getSeconds()) + '</small>';
  document.getElementById('data').textContent = duza(d.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
}

async function pogoda() {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m' +
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day,uv_index,visibility' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max,wind_speed_10m_max' +
    '&timezone=' + encodeURIComponent(STREFA) + '&forecast_days=7';
  try {
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    pokaz(await r.json());
    document.getElementById('blad').style.display = 'none';
  } catch (e) { document.getElementById('blad').style.display = 'block'; }
}

function pokaz(w) {
  const c = w.current, H = w.hourly, D = w.daily;
  // indeks biezacej godziny w prognozie godzinowej
  const teraz = c.time.slice(0, 13); let hi = H.time.findIndex(x => x.slice(0, 13) === teraz); if (hi < 0) hi = 0;
  const opadBylo = H.precipitation.slice(Math.max(0, hi - 2), hi).some(v => v > 0.1);
  const miesiac = new Date().getMonth();
  const T = Math.round(c.temperature_2m);
  document.getElementById('t').textContent = T + '°';
  document.getElementById('opis').textContent = emo(c.weather_code, c.is_day) + ' ' + opis(c.weather_code);
  document.getElementById('odcz').textContent = 'Odczuwalna ' + Math.round(c.apparent_temperature) + '°';
  document.getElementById('minmax').innerHTML = 'Dziś: <b style="color:var(--red)">' + Math.round(D.temperature_2m_max[0]) + '°</b> / <span style="color:var(--blue)">' + Math.round(D.temperature_2m_min[0]) + '°</span>';
  document.getElementById('nakl').src = 's/' + naklejka(c.weather_code, c.temperature_2m, c.wind_speed_10m, c.wind_gusts_10m, c.is_day, opadBylo, miesiac) + '.webp';
  const uv = H.uv_index[hi] != null ? H.uv_index[hi] : D.uv_index_max[0], vis = H.visibility[hi];
  const uvTxt = uv < 3 ? 'niski' : uv < 6 ? 'średni' : uv < 8 ? 'wysoki' : 'b. wysoki';
  const K = [
    ['💧', c.relative_humidity_2m + '%', 'Wilgotność'],
    ['🧭', Math.round(c.pressure_msl) + ' hPa', 'Ciśnienie'],
    ['<span style="display:inline-block;transform:rotate(' + (c.wind_direction_10m + 180) + 'deg)">⬆️</span>', Math.round(c.wind_speed_10m) + ' km/h', 'Wiatr ' + KIERPL[kier(c.wind_direction_10m)]],
    ['🌬️', Math.round(c.wind_gusts_10m) + ' km/h', 'Porywy wiatru'],
    ['☂️', pl1(c.precipitation) + ' mm', 'Opad teraz (dziś ' + pl1(D.precipitation_sum[0]) + ' mm)'],
    ['☁️', c.cloud_cover + '%', 'Zachmurzenie'],
    ['🕶️', (uv != null ? pl1(uv) : '-'), 'UV ' + uvTxt],
    ['👁️', vis != null ? (vis >= 10000 ? Math.round(vis / 1000) + ' km' : pl1(vis / 1000) + ' km') : '-', 'Widoczność'],
    ['🌅', godz(D.sunrise[0]), 'Wschód słońca'],
    ['🌇', godz(D.sunset[0]), 'Zachód słońca'],
    ['🌡️', Math.round(D.temperature_2m_max[0]) + '° / ' + Math.round(D.temperature_2m_min[0]) + '°', 'Dziś max / min'],
    ['🌧️', (D.precipitation_probability_max[0] ?? 0) + '%', 'Szansa deszczu dziś']
  ];
  document.getElementById('kafle').innerHTML = K.map(k => '<div class="k"><div class="i">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="n">' + k[2] + '</div></div>').join('');
  // 24 godziny
  let g = '';
  for (let i = hi; i < Math.min(H.time.length, hi + 24); i++) g += '<div class="g"><div class="h">' + (i === hi ? 'teraz' : godz(H.time[i])) + '</div><div class="e">' + emo(H.weather_code[i], H.is_day[i]) + '</div><div class="tt">' + Math.round(H.temperature_2m[i]) + '°</div><div class="pp">' + (H.precipitation_probability[i] ?? 0) + '% 💧</div></div>';
  document.getElementById('godz').innerHTML = g;
  // 7 dni
  let d = '';
  for (let i = 0; i < D.time.length; i++) {
    const dt = new Date(D.time[i] + 'T12:00:00'), nazwa = i === 0 ? 'dziś' : i === 1 ? 'jutro' : dt.toLocaleDateString('pl-PL', { weekday: 'long' });
    d += '<div class="d"><div class="dn">' + nazwa + '<div class="ds">' + dt.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' }) + '</div></div><div class="e">' + emo(D.weather_code[i], 1) + '</div><div>' + opis(D.weather_code[i]) + '</div><div class="mm"><b>' + Math.round(D.temperature_2m_max[i]) + '°</b> / <span>' + Math.round(D.temperature_2m_min[i]) + '°</span></div><div class="pp">💧 ' + (D.precipitation_probability_max[i] ?? 0) + '% · ' + pl1(D.precipitation_sum[i]) + ' mm</div></div>';
  }
  document.getElementById('dni').innerHTML = d;
  const n = new Date(); document.getElementById('akt').textContent = 'ostatnio ' + dwa(n.getHours()) + ':' + dwa(n.getMinutes());
}

zegar(); setInterval(zegar, 1000);
pogoda(); setInterval(pogoda, 10 * 60 * 1000);
</script>
</body>
</html>
